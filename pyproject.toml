[project]
name = "py-metric-counter"
version = "0.1.1"
description = "Library for counters and histograms that require label values and buckets to be declared upfront"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
